name: Sync sing-box
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - run: |
          rm -rf /tmp/packages
          git clone https://github.com/VIKINGYFY/packages /tmp/packages
      - run: |
         cp -r /tmp/packages/sing-box/* .
         git config user.name "github-actions[bot]"
         git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         git add -A
         if [ -n "$(git diff --cached)" ]; then
           git commit -m "Sync sing-box"
           git push
         fi
